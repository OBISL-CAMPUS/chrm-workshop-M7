                },
                breakout: {
                    title: "කණ්ඩායම් සාකච්ඡා සඳහා ප්‍රශ්න මාලාව",
                    intro: "ප්‍රායෝගික සැසියේදී සිසුන් අතර සාකච්ඡා ඇති කිරීම සඳහා පහත දැක්වෙන ප්‍රශ්න භාවිත කරන්න.",
                    prompts: [
                        "සේවා කාලය මත පමණක් වැටුප් ගෙවීම, බලහත්කාරයෙන් වර්ගීකරණය කිරීමේ ඇගයීම් ක්‍රමයක අසාර්ථකත්වයට හේතු වන්නේ කෙසේද?",
                        "ආයතනයක සමස්ත වැටුප් ව්‍යුහය ප්‍රසිද්ධ කළහොත් සේවකයින් අතර ඇති විය හැකි මානසික සහ සන්නිවේදන අභියෝග මොනවාද?",
                        "සේවකයෙකුගේ කුසලතා නොමැතිකම (Lack of Skill) සහ අභිප්‍රේරණය නොමැතිකම (Lack of Motivation) කළමනාකරුවෙකු වෙන්කර හඳුනා ගන්නේ කෙසේද?",
                        "වෙළඳපල මට්ටමට වඩා අඩු වැටුප් ගෙවීමේ උපායමාර්ගයක් ('Lag' Posture) වඩාත් උචිත වන්නේ කුමන ආර්ථික තත්ත්වයන් යටතේද?",
                        "වඩාත් සාධාරණ සහ වෛෂයික ඇගයීමක් පැවැත්වීමට SBI (Situation-Behavior-Impact) ආකෘතිය උපකාරී වන්නේ කෙසේද?"

        // --- MAIN APP COMPONENT ---

                setTimeout(() => {

            const compaRatio = (salary / midpoint).toFixed(2);
            let compaStatus = "mid";
            let compaColor = "text-brand-500 border-brand-500/30";
            
            if (compaRatio < 0.85) {
                compaStatus = "low";
                compaColor = "text-yellow-400 border-yellow-500/30";
            } else if (compaRatio > 1.15) {
                compaStatus = "high";
                compaColor = "text-tech-400 border-tech-500/30";
            }

            // DYNAMIC LINKAGE: Automatically resolve Compa-Ratio Band for Matrix Lookup
            const derivedCompaBand = compaRatio < 0.85 ? 'low' : (compaRatio > 1.15 ? 'high' : 'mid');

            // Merit Matrix Calculator Logic
            const calcMeritPercentage = () => {
                if (perfRating === '5') {
                    if (derivedCompaBand === 'low') return '8% - 10%';
                    if (derivedCompaBand === 'mid') return '6% - 7%';
                    return '4% - 5%';
                }
                if (perfRating === '3') {
                    if (derivedCompaBand === 'low') return '5% - 6%';
                    if (derivedCompaBand === 'mid') return '3% - 4%';
                    return '1% - 2%';
                }
                return '0%';
            };

            // Preset Injector for Student Testing
            const injectPreset = (sal, mid, perf) => {
                setSalary(sal);
                setMidpoint(mid);
                setPerfRating(perf);

                                                        <input type="range" min="50000" max="400000" step="5000" value={salary} onChange={(e) => setSalary(Number(e.target.value))} className="w-full h-1 bg-slate-800 rounded appearance-none cursor-pointer accent-brand-500" />
                                                    </div>

                                                    <div>
                                                        <div className="flex justify-between text-xs mb-1">
                                                            <span>{activeTrans.diag.midLabel}</span>
                                                            <span className="font-mono text-tech-400 font-bold">Rs. {midpoint.toLocaleString()}</span>
                                                        </div>
                                                        <input type="range" min="100000" max="300000" step="5000" value={midpoint} onChange={(e) => setMidpoint(Number(e.target.value))} className="w-full h-1 bg-slate-800 rounded appearance-none cursor-pointer accent-tech-500" />
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="bg-slate-950 p-4 rounded-lg border border-slate-900 flex flex-col md:flex-row items-center gap-4 mt-4">
                                                <div className="text-center md:text-left shrink-0">
                                                    <span className="text-xs text-slate-500 block">{activeTrans.diag.resultLabel}</span>
                                                    <span className={`text-4xl font-black ${compaColor}`}>{compaRatio}</span>
                                                </div>
                                                <div className="flex-1">
                                                    <p className="text-xs text-slate-400 leading-relaxed">{activeTrans.diag.states[compaStatus]}</p>
                                                </div>
                                            </div>
                                        </div>

                                        {/* CALC 2: MERIT MATRIX */}
                                        <div className="glass-panel p-6 rounded-xl space-y-4 flex flex-col justify-between">
                                            <div>
                                                <div className="border-b border-slate-900 pb-2 mb-4">
                                                    <h4 className="text-sm font-bold text-slate-200 uppercase tracking-wide">{activeTrans.diag.calc2Title}</h4>
                                                    <p className="text-xs text-slate-500 mt-0.5">{activeTrans.diag.calc2Intro}</p>
                                                </div>

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="text-xs text-slate-400 block mb-1.5">{activeTrans.diag.ratingLabel}</label>
                                                        <select value={perfRating} onChange={(e) => setPerfRating(e.target.value)} className="w-full bg-slate-900 border border-slate-800 text-xs rounded p-2 text-slate-200 focus:outline-none focus:border-brand-500">
                                                            <option value="5">{activeTrans.diag.rating5}</option>
                                                            <option value="3">{activeTrans.diag.rating3}</option>
                                                            <option value="1">{activeTrans.diag.rating1}</option>
                                                        </select>
                                                    </div>

                                                    <div>
                                                        <label className="text-xs text-slate-400 block mb-1.5">{activeTrans.diag.bandLabel}</label>
                                                        <div className="w-full bg-slate-950 border border-slate-900 text-xs rounded p-2 text-slate-300 font-medium">
                                                            {derivedCompaBand === 'low' && activeTrans.diag.bandLow}
                                                            {derivedCompaBand === 'mid' && activeTrans.diag.bandMid}
                                                            {derivedCompaBand === 'high' && activeTrans.diag.bandHigh}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="bg-slate-950 p-4 rounded-lg border border-slate-900 flex flex-col md:flex-row items-center gap-4 mt-4">
                                                <div className="text-center md:text-left shrink-0">
                                                    <span className="text-xs text-slate-500 block">{activeTrans.diag.meritResult}</span>
                                                    <span className="text-4xl font-black text-brand-500">{calcMeritPercentage()}</span>
                                                </div>
                                                <div className="flex-1">
                                                    <p className="text-xs text-slate-400 leading-relaxed">{activeTrans.diag.meritReason}</p>
                                                </div>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            )}

                            {/* TAB 5: SYSTEM SIMULATION 1 */}
                            {activeTab === 'sim1' && (
                                <div className="space-y-6 animate-fadeIn">
                                    <div className="border-b border-slate-900 pb-4">
                                        <h3 className="text-2xl font-black tracking-tight text-white">{activeTrans.sim1.title}</h3>
                                        <p className="text-slate-400 text-sm mt-1">{activeTrans.sim1.intro}</p>
                                    </div>

                                    <div className="flex bg-slate-900/60 border border-slate-800 p-1 rounded-lg max-w-md">
                                        <button onClick={() => triggerFrameworkChange('traditional')} className={`flex-1 text-xs font-bold uppercase py-2 px-3 rounded ${frameworkState === 'traditional' ? 'bg-red-950/50 text-red-400 border border-red-900/40' : 'text-slate-400'}`}>
                                            {activeTrans.sim1.traditionalBtn}
                                        </button>
                                        <button onClick={() => triggerFrameworkChange('modern')} className={`flex-1 text-xs font-bold uppercase py-2 px-3 rounded ${frameworkState === 'modern' ? 'bg-brand-950/50 text-brand-400 border border-brand-900/40' : 'text-slate-400'}`}>
                                            {activeTrans.sim1.modernBtn}
                                        </button>
                                    </div>

                                    <div className="glass-panel p-6 rounded-xl relative min-h-[18rem] flex flex-col justify-between">
                                        {isSimLoading && (
                                            <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm rounded-xl flex items-center justify-center z-10">
                                                <div className="flex items-center gap-3">
                                                    <span className="w-4 h-4 border-2 border-brand-500 border-t-transparent rounded-full animate-spin"></span>
                                                    <span className="text-xs tracking-widest uppercase font-mono text-slate-400">{activeTrans.sim1.statusLoading}</span>
                                                </div>
                                            </div>
                                        )}

                                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                                            
                                            {/* CSS Structure Map Visualizer */}
                                            <div className="lg:col-span-7 space-y-4">
                                                <h4 className="text-xs font-mono uppercase text-slate-400">{activeTrans.sim1.structureTitle}</h4>
                                                
                                                {frameworkState === 'traditional' ? (
                                                    <div className="grid grid-cols-3 gap-3">
                                                        {[
                                                            { name: "Unit A", status: "border-red-500 bg-red-950/20 text-red-400" },
                                                            { name: "Unit B", status: "border-red-500 bg-red-950/20 text-red-400" },
                                                            { name: "Unit C", status: "border-red-500 bg-red-950/20 text-red-400" },
                                                            { name: "Silo 1", status: "border-yellow-600 bg-yellow-950/10 text-yellow-500" },
                                                            { name: "Silo 2", status: "border-yellow-600 bg-yellow-950/10 text-yellow-500" },
                                                            { name: "Silo 3", status: "border-yellow-600 bg-yellow-950/10 text-yellow-500" }
                                                        ].map((node, idx) => (
                                                            <div key={idx} className={`p-3 border rounded text-xs font-mono text-center transition-all ${node.status}`}>
                                                                🛑 {node.name}
                                                            </div>
                                                        ))}
                                                    </div>
                                                ) : (
                                                    <div className="grid grid-cols-3 gap-3">
                                                        {[
                                                            { name: "Team Blue", status: "border-brand-500 bg-brand-950/20 text-brand-400" },
                                                            { name: "Team Gold", status: "border-brand-500 bg-brand-950/20 text-brand-400" },
                                                            { name: "Team Red", status: "border-brand-500 bg-brand-950/20 text-brand-400" },
                                                            { name: "Sync Loop 1", status: "border-tech-500 bg-tech-950/20 text-tech-400" },
                                                            { name: "Sync Loop 2", status: "border-tech-500 bg-tech-950/20 text-tech-400" },
                                                            { name: "Sync Loop 3", status: "border-tech-500 bg-tech-950/20 text-tech-400" }
                                                        ].map((node, idx) => (
                                                            <div key={idx} className={`p-3 border rounded text-xs font-mono text-center transition-all ${node.status} animate-pulse`}>
                                                                ⚡ {node.name}
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>

                                            {/* Impact Panel */}
                                            <div className="lg:col-span-5 space-y-4">
                                                <h4 className="text-xs font-mono uppercase text-slate-400">{activeTrans.sim1.impactTitle}</h4>
                                                
                                                <ul className="space-y-3">
                                                    {frameworkState === 'traditional' ? (
                                                        activeTrans.sim1.traditionalTraits.map((trait, i) => (
                                                            <li key={i} className="text-xs text-slate-400 bg-red-950/10 border border-red-950 p-2.5 rounded flex items-start gap-2">
                                                                <span className="text-red-500 shrink-0">✕</span>
                                                                <span>{trait}</span>
                                                            </li>
                                                        ))
                                                    ) : (
                                                        activeTrans.sim1.modernTraits.map((trait, i) => (
                                                            <li key={i} className="text-xs text-slate-300 bg-brand-950/10 border border-brand-950/40 p-2.5 rounded flex items-start gap-2">
                                                                <span className="text-brand-400 shrink-0">✓</span>
                                                                <span>{trait}</span>
                                                            </li>
                                                        ))
                                                    )}
                                                </ul>
                                            </div>

                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB 6: SYSTEM SIMULATION 2 */}
                            {activeTab === 'sim2' && (
                                <div className="space-y-6">
                                    <div className="border-b border-slate-900 pb-4">
                                        <h3 className="text-2xl font-black tracking-tight text-white">{activeTrans.sim2.title}</h3>
                                        <p className="text-slate-400 text-sm mt-1">{activeTrans.sim2.intro}</p>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div onClick={() => setCascadeTier('corp')} className={`p-4 rounded-xl cursor-pointer border transition-all ${cascadeTier === 'corp' ? 'bg-brand-950/60 border-brand-500 shadow-lg' : 'glass-panel border-slate-800'}`}>
                                            <span className="text-xs font-mono text-slate-500 uppercase tracking-widest">Tier 1</span>
                                            <h4 className="text-sm font-bold text-slate-200 mt-1">{language === 'en' ? 'Corporate Level' : 'ආයතනික මට්ටම'}</h4>
                                        </div>
                                        <div onClick={() => setCascadeTier('dept')} className={`p-4 rounded-xl cursor-pointer border transition-all ${cascadeTier === 'dept' ? 'bg-tech-950/60 border-tech-500 shadow-lg' : 'glass-panel border-slate-800'}`}>
                                            <span className="text-xs font-mono text-slate-500 uppercase tracking-widest">Tier 2</span>
                                            <h4 className="text-sm font-bold text-slate-200 mt-1">{language === 'en' ? 'Departmental Level' : 'දෙපාර්තමේන්තු මට්ටම'}</h4>
                                        </div>
                                        <div onClick={() => setCascadeTier('indiv')} className={`p-4 rounded-xl cursor-pointer border transition-all ${cascadeTier === 'indiv' ? 'bg-purple-950/60 border-purple-500 shadow-lg' : 'glass-panel border-slate-800'}`}>
                                            <span className="text-xs font-mono text-slate-500 uppercase tracking-widest">Tier 3</span>
                                            <h4 className="text-sm font-bold text-slate-200 mt-1">{language === 'en' ? 'Individual Level' : 'පුද්ගලික මට්ටම'}</h4>
                                        </div>
                                    </div>

                                    <div className="glass-panel p-6 rounded-xl space-y-4">
                                        <div className="space-y-4 relative">
                                            {/* Tier 1 Node */}
                                            <div className={`p-4 rounded-lg border text-xs transition-all ${cascadeTier === 'corp' ? 'bg-brand-950 border-brand-500 text-slate-100 font-bold scale-[1.01]' : 'bg-slate-950/40 border-slate-900 text-slate-500'}`}>
                                                <span className="font-mono text-slate-400 block mb-1">🎯 {activeTrans.sim2.corp}</span>
                                                <p>{activeTrans.sim2.corpDesc}</p>
                                            </div>

                                            <div className="flex justify-center my-1">
                                                <div className={`w-0.5 h-6 ${cascadeTier === 'dept' || cascadeTier === 'indiv' ? 'bg-brand-500' : 'bg-slate-800'}`}></div>
                                            </div>

                                            {/* Tier 2 Node */}
                                            <div className={`p-4 rounded-lg border text-xs transition-all ${cascadeTier === 'dept' ? 'bg-tech-950 border-tech-500 text-slate-100 font-bold scale-[1.01]' : 'bg-slate-950/40 border-slate-900 text-slate-500'}`}>
                                                <span className="font-mono text-slate-400 block mb-1">📊 {activeTrans.sim2.dept}</span>
                                                <p>{activeTrans.sim2.deptDesc}</p>
                                            </div>

                                            <div className="flex justify-center my-1">
                                                <div className={`w-0.5 h-6 ${cascadeTier === 'indiv' ? 'bg-tech-500' : 'bg-slate-800'}`}></div>
                                            </div>

                                            {/* Tier 3 Node */}
                                            <div className={`p-4 rounded-lg border text-xs transition-all ${cascadeTier === 'indiv' ? 'bg-purple-950 border-purple-500 text-slate-100 font-bold scale-[1.01]' : 'bg-slate-950/40 border-slate-900 text-slate-500'}`}>
                                                <span className="font-mono text-slate-400 block mb-1">👤 {activeTrans.sim2.indiv}</span>
                                                <p>{activeTrans.sim2.indivDesc}</p>
                                            </div>
                                        </div>

                                        <p className="text-[11px] text-slate-500 italic text-center mt-4">
                                            {activeTrans.sim2.tip}
                                        </p>
                                    </div>
                                </div>
                            )}

                            {/* TAB 7: SYSTEM SIMULATION 3 */}
                            {activeTab === 'sim3' && (
                                <div className="space-y-6">
                                    <div className="border-b border-slate-900 pb-4">
                                        <h3 className="text-2xl font-black tracking-tight text-white">{activeTrans.sim3.title}</h3>
                                        <p className="text-slate-400 text-sm mt-1">{activeTrans.sim3.intro}</p>
                                    </div>

                                    <div className="flex bg-slate-900/60 p-1 border border-slate-800 rounded-lg max-w-sm">
                                        <button onClick={() => setWorkflowStyle('linear')} className={`flex-1 text-xs font-bold uppercase py-2 rounded ${workflowStyle === 'linear' ? 'bg-red-950/50 text-red-400 border border-red-900/30' : 'text-slate-400'}`}>
                                            {activeTrans.sim3.linearBtn}
                                        </button>
                                        <button onClick={() => setWorkflowStyle('circular')} className={`flex-1 text-xs font-bold uppercase py-2 rounded ${workflowStyle === 'circular' ? 'bg-brand-950/50 text-brand-400 border border-brand-900/30' : 'text-slate-400'}`}>
                                            {activeTrans.sim3.loopBtn}
                                        </button>
                                    </div>

                                    <div className="glass-panel p-6 rounded-xl min-h-[14rem] flex flex-col justify-center">
                                        {workflowStyle === 'linear' ? (
                                            <div className="space-y-5">
                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                    {activeTrans.sim3.linearSteps.map((step, idx) => (
                                                        <div key={idx} className="p-3 bg-red-950/10 border border-red-900/40 rounded text-xs text-red-300 font-mono flex items-center justify-between">
                                                            <span>{step}</span>
                                                            <span className="text-red-500 md:hidden">↓</span>
                                                            <span className="hidden md:inline text-red-500">{idx < 2 ? '➔' : ''}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                                <p className="text-xs text-red-400 bg-red-950/20 p-3 rounded border border-red-900/50 font-medium">
                                                    {activeTrans.sim3.linearCritique}
                                                </p>
                                            </div>
                                        ) : (
                                            <div className="space-y-5">
                                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                                    {activeTrans.sim3.loopSteps.map((step, idx) => (
                                                        <div key={idx} className="p-3 bg-brand-950/10 border border-brand-900/40 rounded text-xs text-brand-300 font-mono flex items-center justify-between animate-pulse">
                                                            <span>{step}</span>
                                                            <span className="text-brand-500 md:hidden">↓</span>
                                                            <span className="hidden md:inline text-brand-500">{idx < 3 ? '➔' : '↺'}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                                <p className="text-xs text-brand-400 bg-brand-950/20 p-3 rounded border border-brand-900/50 font-medium">
                                                    {activeTrans.sim3.loopCritique}
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* TAB 8: BREAKOUT ROOMS */}
                            {activeTab === 'breakout' && (
                                <div className="space-y-6">
                                    <div className="border-b border-slate-900 pb-4">
                                        <h3 className="text-2xl font-black tracking-tight text-white">{activeTrans.breakout.title}</h3>
                                        <p className="text-slate-400 text-sm mt-1">{activeTrans.breakout.intro}</p>
                                    </div>

                                    <div className="space-y-4">
                                        {activeTrans.breakout.prompts.map((prompt, index) => (
                                            <div key={index} className="glass-panel p-5 rounded-xl flex gap-4 items-start transition-all hover:translate-x-1">
                                                <span className="w-6 h-6 rounded-full bg-brand-950 text-brand-400 border border-brand-900/50 flex items-center justify-center text-xs font-mono font-bold shrink-0">
                                                    {index + 1}
                                                </span>
                                                <div className="flex-1">
                                                    <p className="text-sm font-medium text-slate-200 leading-relaxed">{prompt}</p>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>
                </div>
            );
        }

        // --- APPLICATION INITIALIZATION ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
